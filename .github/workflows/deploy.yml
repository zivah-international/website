name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      # -------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      # -------------------------------------------------------
      # 2. Setup Node.js (match version in cPanel – 24.x)
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: '11.9.0'
          run_install: false

      # -------------------------------------------------------
      # 3. Install dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -------------------------------------------------------
      # 4. Build Next.js (standalone output)
      # -------------------------------------------------------
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # -------------------------------------------------------
      # 5. Package deploy files
      # -------------------------------------------------------
      - name: Prepare deploy package
        run: |
          mkdir -p deploy/.next/static
          mkdir -p deploy/public
          mkdir -p deploy/prisma

          # Copy standalone build – exclude top-level node_modules only
          # (CloudLinux manages top-level node_modules via symlink,
          # but Turbopack's hashed external modules in .next/node_modules/ must be included)
          rsync -a --exclude='/node_modules' .next/standalone/. deploy/

          # Static assets
          cp -r .next/static/. deploy/.next/static/

          # Public folder
          cp -r public/. deploy/public/

          # Clean production package.json (for cPanel app detection)
          node -e "const fs = require('fs'); const pkg = require('./package.json'); delete pkg.devDependencies; delete pkg['lint-staged']; pkg.scripts = { start: 'node server.cjs' }; fs.writeFileSync('deploy/package.json', JSON.stringify(pkg, null, 2));"
          cp pnpm-lock.yaml deploy/pnpm-lock.yaml 2>/dev/null || :
          cp .npmrc deploy/.npmrc 2>/dev/null || :
          cp pnpm-workspace.yaml deploy/pnpm-workspace.yaml 2>/dev/null || :

          # Remove top-level node_modules (CloudLinux manages it via symlink)
          rm -rf deploy/node_modules

          # Prisma schema (dev-only, for db:push/db:seed on server)
          cp prisma/schema.prisma deploy/prisma/schema.prisma

      # -------------------------------------------------------
      # 6. Upload to cPanel via FTP
      # -------------------------------------------------------
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_PATH }}/
          exclude: |
            **/.git*/**
            **/.next/cache/**
            **/*.map
            **/.DS_Store
            **/Thumbs.db
            **/*.log
            **/.env*

      # -------------------------------------------------------
      # 7. Restart the Node.js app via cPanel UAPI
      # -------------------------------------------------------
      - name: Restart Node.js app
        run: |
          echo "Restarting app via cPanel UAPI..."
          RESPONSE=$(curl -s -G \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            --data-urlencode "app_name=${{ secrets.CPANEL_APP_NAME }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/NodeJS/restart_app")
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            if d.get('status') == 0:
              print('ERROR:', d.get('errors'))
              sys.exit(1)
            else:
              print('App restarted successfully')
          except Exception as e:
            print('Could not parse response:', e)
          "
